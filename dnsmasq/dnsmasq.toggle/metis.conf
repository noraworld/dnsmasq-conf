# and they sometimes include a little bit sexual pictures. Google services like Google Meet, Google Drive, Gmail etc.
# also use lh3.googleusercontent.com, even though it's not always necessary (mainly the images and the icons used within
# those services)
# https://knowledge.workspace.google.com/admin/meet/prepare-your-network-for-meet-meetings-and-live-streams
