# These domains are used in YouTube Ads thumbnails (shown in the list of the recommended videos in the video play page)
# and they sometimes include a little bit sexual pictures. Google services like Google Meet, Google Drive, Gmail etc.
# also use lh3.googleusercontent.com, even though it's not always necessary (mainly the images and the icons used within
# those services)
# https://knowledge.workspace.google.com/admin/meet/prepare-your-network-for-meet-meetings-and-live-streams
address=/lh1.googleusercontent.com/
address=/lh2.googleusercontent.com/
address=/lh3.googleusercontent.com/
address=/lh4.googleusercontent.com/
address=/lh5.googleusercontent.com/
address=/lh6.googleusercontent.com/
address=/lh7.googleusercontent.com/
address=/lh8.googleusercontent.com/
address=/lh9.googleusercontent.com/
address=/ci3.googleusercontent.com/ # The images in Gmail

# These are basically the same as amazon.conf, but the schedule and the restrictions are different.
