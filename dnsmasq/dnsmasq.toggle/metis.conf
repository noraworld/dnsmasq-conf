address=/info.nicomanga.jp/
address=/commons.nicovideo.jp/
address=/commons.wikimedia.org/

# hatena.com
#
# Most of the subdomains are redirected to hatena.ne.jp (e.g. m.hatena.com -> m.hatena.ne.jp,) but not all of them are
# (e.g. s.hatena.com.) hatena.com seems to be hardly ever used in Japan, so it's blocked at the apex domain level to
# avoid unwanted access.
#
# https://hatena.co.jp/press/release/entry/2007/07/11/193714
#
address=/hatena.com/

# hatena.ne.jp
#
# Hatena owns a lot of small services and uses the hatena.ne.jp subdomains, and most of them are not used very often
# unless you are a power user, so they are blocked at the apex domain level to make it easy to maintain their domains.
#
# https://hatena.co.jp/press/release/entry/2006/03/13/181912
#
address=/hatena.ne.jp/
