# The reason for blocking Google Search is that sometimes I can't stop searching for the mature websites in there endlessly.
# It goes without saying that not being able to use it is inconvenient, but I've realized I haven't been using it that much.
# That's why it's not a bad idea that it's prohibited normally and able to be unlocked whenever I would like to utilize it.
# The name origin of this network restriction comes from: https://chatgpt.com/share/6a896657-07ac-83e9-a0df-64d4560f2db6
address=/www.google.com/
address=/www.google.co.jp/



# The thumbnails of the images in 'Shared with me' of Google Drive are retrieved from drive.google.com (the same domain as
# the webpage itself,) and some of them are sensitive. They can't be removed from your Google Drive unless you block or
# report them ('Move to trash' is unavailable and there is no way to unshare them.)
#
# TIPS:
#   The preview images (full resolution version) are obtained from lh3.googleusercontent.com.
#   Google Drive for desktop works fine even if the domain 'drive.google.com' is restricted.
address=/drive.google.com/



# See athena_allow.conf for details
address=/accounts.youtube.com/
address=/studio.youtube.com/rtmp.youtube.com/c.youtube.com/i9.ytimg.com/yt3.ggpht.com/
address=/upload.youtube.com/
